# kitty の設定。WezTerm (~/.config/wezterm/) からの移行で組み直したもの。
#
# 対応する WezTerm 側:
#   このファイル       … wezterm.lua / colors.lua / const.lua
#   keys.conf          … keys.lua / key_tables.lua
#   tab_bar.py         … status_bar.lua / tab_title.lua / tab_bar_metrics.lua
#   battery.py         … battery.lua
#   timemachine.py     … timemachine.lua
#   progress_bar.py    … progress_bar.lua
#   open-actions.conf  … open_uri.lua
#   editprompt.py / close_pane.py / pstree.py / paste.py … keys.lua の action_callback
#
# WezTerm 側に対応の無いもの:
#   poller.py                     … 外部コマンドを描画を止めずに回すための足回り
#   toggles.py / status_toggle.py … 右ステータスの項目を ⌘⇧T / ⌘⇧G で出し入れする
#   gcal.py                       … 右ステータスに出す予定 (~/.claude/scripts/gcal.ts)
#   running.py                    … 右ステータスに出す長く動いているコマンド
#   codediff.py                   … Claude Code の下に codediff.nvim を出す (⌘D とフック)
#   aux_panes.py                  … editprompt と codediff を協調させる共通処理

#: 配色・フォント {{{

# WezTerm 側 (colors.lua) と同じ tokyonight storm。nvim のプラグインが配布して
# いるものをそのまま読む。無い環境では kitty 既定の配色になる。
include ~/.local/share/nvim/lazy/tokyonight.nvim/extras/kitty/tokyonight_storm.conf

font_family SF Mono Square
font_size   16.0

# text_composition_strategy は既定の platform のまま (= macOS では gamma 1.7 /
# contrast 30% で、CoreText の合成に寄せた値) にしておく。SF Mono Square の元
# は Apple の SF Mono なので、これが本来意図された見え方に一番近い。
#
# 以前は WezTerm の細い見え方に合わせて legacy (= "1.0 0") にしていた。地の文
# (暗い背景に明るい文字) は細くなるが、ブロックカーソルの下や選択範囲のように
# 明るい背景へ暗い文字が乗る箇所が痩せて不均一になる。両者の中間が欲しければ
# "<gamma> <contrast>" を直接指定できて、"1.7 0" がその折衷になる。

#: }}}

#: ウィンドウ {{{

# WezTerm の window_decorations = "RESIZE" 相当。
hide_window_decorations titlebar-only
# WezTerm の window_background_opacity / macos_window_background_blur 相当。
background_opacity 0.96
background_blur    20
# 0 (WezTerm の window_close_confirmation = "NeverPrompt" 相当) だと ⌘Q の誤打で
# 動いている Claude Code がまとめて死ぬ。負値にすると「シェル以外のプログラムが
# 動いているウィンドウ数 >= 1」で確認が出る (boss.py の
# `needs_confirmation = x != 0 and num >= abs(x)`、x < 0 のとき num は
# num_active_windows)。退社時に意図して閉じるときは確認を 1 回通すだけで済む。
confirm_os_window_close -1
# kitty の既定は 0 で、文字がウィンドウの縁に貼り付いて読みにくい。WezTerm の
# 既定 (左右 1cell / 上下 0.5cell) に合わせる。SF Mono Square 16pt のセルは
# 11x21px (96dpi) なので、pt 換算でどちらも概ね 8pt。
window_padding_width 8
# WezTerm の initial_cols / initial_rows 相当 (c = セル単位)。
initial_window_width  200c
initial_window_height 80c
# 0.49 で入ったペイン境界の角丸。既定の draw_minimal_borders (yes) は隣と接する
# 辺にしか境界を引かないので角が存在せず、window_border_radius だけ書いても何も
# 起きない。全周に引かせたうえで、既定の 0.5pt では角丸が潰れるので線も太くする。
# 角丸は角のセルに重ねて描かれるが、上の window_padding_width 8 があるので文字に
# は掛からない。単位を省くと pt。
draw_minimal_borders no
window_border_width  1pt
window_border_radius 6

#: }}}

#: シェル・エディタ {{{

# WezTerm の default_prog 相当。
shell  /opt/homebrew/bin/fish
editor /opt/homebrew/bin/nvim

macos_option_as_alt yes

# WezTerm のシェルから kitty を起動すると WEZTERM_* が丸ごと継承され、全ウィンドウ
# に漏れる。$WEZTERM_PANE を見て動く仕掛け (editprompt / claude-code-hooks
# tabcolor / notify / fish_right_prompt の通知抑止) が WezTerm 側のペインを掴んで
# しまい、送ったキーが向こうへ飛ぶ。値なしで名前だけ書くと子プロセスから消える。
env WEZTERM_PANE
env WEZTERM_UNIX_SOCKET
env WEZTERM_EXECUTABLE
env WEZTERM_EXECUTABLE_DIR
env WEZTERM_CONFIG_FILE
env WEZTERM_CONFIG_DIR

#: }}}

#: watcher {{{

# 全ウィンドウのイベントを拾う。用途は 2 つ。相方を失って取り残された editprompt
# ペインの後始末 (WezTerm の reap_orphan_editprompt 相当) と、動いている Claude Code
# のタブを startup_session へ書き出すこと (session_state.py)。
watcher watcher.py

#: }}}

#: セッションの復元 {{{

# 退社時に Mac ごと電源を落とす運用なので、動いている Claude Code は毎晩 kitty ごと
# 死ぬ。会話は transcript に残っているので、session_state.py が書き出した
# `claude --resume <id>` 入りのセッションファイルを読ませて、朝に並べ直す。
#
# 生成物なので設定ディレクトリではなく state に置く。まだ書き出されていなければ
# kitty は「読めなかったので無視する」とログに出して通常起動するだけなので、初回や
# 消したあとも問題にならない (session.py の create_sessions)。
startup_session ~/.local/state/kitty/session.conf

#: }}}

#: レイアウト {{{

# stack が WezTerm の zoom 相当で、アクティブなウィンドウだけを表示する。
# editprompt を隠すのに使う (editprompt.py 参照)。
enabled_layouts splits,stack

#: }}}

#: リモート制御 {{{

# `wezterm cli` 相当。nvim (editprompt / skkeleton)、claude-code-hooks、fish から
# 叩く。子プロセスには KITTY_LISTEN_ON が渡るので、ソケットのパスを意識せずに
# `kitten @ ...` が通る。
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

#: }}}

#: タブバー {{{

# tab_bar.py の draw_tab() で描く。WezTerm の format-tab-title 相当。
tab_bar_style custom
# WezTerm の tab_title.lua が半円キャップを手描きしていた角丸チップは、kitty では
# これだけで出る (ple_left_half_circle_thick を自分で置く必要が無い)。
tab_powerline_style round
# WezTerm の tab_max_width = 28 相当。
tab_title_max_length 28
# kitty の既定は bold-italic。WezTerm の tab_title.lua はアクティブタブに
# Intensity = "Bold" だけを付けていたので斜体は落とす。
active_tab_font_style   bold
inactive_tab_font_style normal
# 既定のテンプレートは OSC 9;4 の進捗を {tab.last_focused_progress_percent} で
# 「75% 」のような数値として出す。WezTerm ではブロックのバーで描いていたので、
# ここからは外して tab_bar.py が {title} の手前に差し込む。
tab_title_template {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}

#: }}}

#: カスタムシェーダ {{{

# 0.49 で入った custom_shaders。名前は kitty 同梱のもの (kitty.app の
# Contents/Resources/kitty/kitty/shaders/custom/ にある .slang の名前) か、
# ~/.config/kitty/shaders/ に自分で置いた .slang / .pipeline を指す。空白区切りで
# 複数並べると、その順に重ねて適用される。
#
# .slang から GLSL への変換は kitty が起動後に Slang コンパイラ (slangc) を呼んで
# 行う。本家の kitty.app はそれを同梱しているが、こちらは Homebrew 版なので
# delphinus/homebrew-kitty が libexec に入れ、app bundle の Info.plist の
# LSEnvironment で $SLANGC として渡している。Dock から起動した kitty の PATH は
# /usr/bin:/bin:/usr/sbin:/sbin だけなので、PATH 任せにはできない。
#
# 同梱されているもの (動画の一覧は https://sw.kovidgoyal.net/kitty/custom-shaders/):
#   focus-highlight                     フォーカスが移ったときアクティブ側を光らせる
#   dim-inactive-windows                非アクティブ側を暗くしたまま保つ (上の静的版)
#   tab-change                          タブ切り替えのワイプ
#   spotlight                           マウスの周りを照らす
#   pond-ripple                         クリックした位置から波紋
#   crt / crt-blue / tft                CRT・液晶を模した走査線や歪み
#   negative / bloom                    色の反転、明るい部分のにじみ
#   inside-the-matrix / northern-lights 背景のアニメーション
#   underwater / water                  同上 (水中・水面)
#   fireworks / fireworks-rockets       同上 (花火)
#   cursor-trail-default                カーソルの軌跡。別途 cursor_trail が要る
#   cursor-trail-blaze                  同上 (炎)
#   cursor-trail-lightning              同上 (稲妻)
#
# crt と crt-blue は background_opacity が 1 未満だと動かない (シェーダ側の但し
# 書き)。上の background_opacity 0.96 のままでは出ない。1 にすれば出ることは確認
# したので、試すときは設定を触らず CLI で両方まとめて上書きする:
#
#   kitten @ load-config -o background_opacity=1 -o custom_shaders=crt
#   kitten @ load-config --ignore-overrides   # 元に戻す
#
# -o で与えた上書きは以後の load-config にも残るので、戻すときは
# --ignore-overrides が要る。
#
# 変数を変えたり複数を組み合わせたりするには .pipeline ファイルを書く。書式は
# 上の URL の「Customising and composing shaders」。名前に .slang と .pipeline の
# どちらもあるときは .pipeline が優先され、shaders/ 以下が同梱より先に見られる。
#
# 並び順は描画順。減光は最後に置く。背景のアニメーション (northern-lights 等) を
# 足すときは先頭に入れると、非アクティブなペインではそれも一緒に暗くなる。
custom_shaders pond-ripple tab-change-fast.pipeline cursor-trail-blaze focus.pipeline

# cursor-trail-* はこれが 0 (既定) だと何も描かない。値は「カーソルがその位置に
# 留まっていた時間 (ms)」の閾値で、これを超えてから動いたときだけ軌跡を引く。
# 複雑な TUI の再描画でカーソルが飛び回るのに追随して残像だらけになるのを防ぐ
# ためのもの。同梱のドキュメントは 1 を例に挙げている。
cursor_trail 1

#: }}}

#: キーバインド {{{

# WezTerm の keys.lua + key_tables.lua に相当。
include keys.conf

#: }}}
