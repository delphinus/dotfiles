# OSC 8 のハイパーリンクをクリックしたときの動作。WezTerm の open_uri.lua に相当。
#
# Claude Code 等が出す file:// リンクを、macOS の既定アプリではなく新しいタブの
# nvim で開く。fragment が `L42` / `42` の形ならその行に飛ぶ。
#
# 行番号の取り出しとログインシェル経由の起動は bin/kitty-open-file が担う。
# ここでコマンド文字列に組み立てないのは、${FILE_PATH} を素の引数として渡せば
# kitty が 1 引数として展開してくれるため (空白や引用符を含むパスでも安全)。
#
# file:// 以外 (https 等) はここに書かないことで、kitty の既定動作
# (ブラウザ / 既定のアプリで開く) に委ねる。

protocol file
action launch --type=tab --cwd=current /Users/jinnouchi.yasushi/git/github.com/delphinus/dotfiles/bin/kitty-open-file ${FILE_PATH} ${FRAGMENT}
