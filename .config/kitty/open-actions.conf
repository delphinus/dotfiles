# OSC 8 のハイパーリンクをクリックしたときの動作。WezTerm の open_uri.lua に相当。
#
# Claude Code 等が出す file:// リンクを、macOS の既定アプリではなく新しいタブの
# nvim で開く。fragment が `L42` / `42` の形ならその行に飛ぶ。
#
# 振り分けは bin/kitty-open-match に任せる。⇧⌘U (keys.conf の hints) と同じ判定を
# 通したいため。テキストなら nvim、画像や PDF なら既定のアプリへ回る。
#
# ここでコマンド文字列に組み立てないのは、${FILE_PATH} を素の引数として渡せば
# kitty が 1 引数として展開してくれるため (空白や引用符を含むパスでも安全)。
#
# --type=background にしてあるのは、タブを作るかどうかを kitty-open-match が決める
# ため。画像を開くときはタブが要らないし、nvim のときは向こうが自分で
# kitten @ launch --type=tab する。ここでタブを作ると二重になる。
#
# --allow-remote-control が要るのはそのため。background で起こしたプロセスの環境には
# KITTY_LISTEN_ON が入らず (⇧⌘U 側は hints が自分で足すので要らない)、これが無いと
# 向こうの kitten @ launch が kitty に届かず、黙って何も開かずに終わる。
#
# file:// 以外 (https 等) はここに書かないことで、kitty の既定動作
# (ブラウザ / 既定のアプリで開く) に委ねる。

protocol file
action launch --type=background --allow-remote-control --cwd=current /Users/jinnouchi.yasushi/git/github.com/delphinus/dotfiles/bin/kitty-open-match ${FILE_PATH} ${FRAGMENT}
