# キーバインド。WezTerm の keys.lua + key_tables.lua に相当する。
#
# WezTerm 側は disable_default_key_bindings = true で既定を全部消していたので、
# ここでも同じにする。kitty の既定を残すと、cmd+w が close_tab、cmd+enter が
# new_window といった具合に、WezTerm と違う挙動が黙って混ざる (実際どちらも踏んだ)。
clear_all_shortcuts yes

#: フォント {{{

map cmd+minus   change_font_size current -1.0
map cmd+equal   change_font_size current +1.0
map cmd+0       change_font_size current 0
# WezTerm の ResetFontAndWindowSize 相当。kitty には OS ウィンドウの寸法を戻す
# アクションが無いので、フォントとペインの分割比だけを戻す。
map cmd+shift+0 combine : change_font_size all 0 : reset_window_sizes

#: }}}

#: タブ {{{

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

map cmd+t new_tab_with_cwd

map cmd+shift+[  previous_tab
map cmd+shift+] next_tab

# タブバーはドラッグでの並べ替えに対応していないので、タブの移動はここから。
map cmd+ctrl+shift+[  move_tab_backward
map cmd+ctrl+shift+] move_tab_forward

# WezTerm の move_to_new_tab。いまのペインを切り離して新しいタブにする。
map cmd+shift+1 detach_window new-tab

#: }}}

#: ペイン (kitty では「ウィンドウ」) {{{

# WezTerm の SplitVertical は下に、SplitHorizontal は右に開く。kitty の hsplit /
# vsplit は「分割線の向き」で命名されているので対応が逆に見えるが、これで同じ。
map cmd+s       launch --location=hsplit --cwd=current
map cmd+shift+v launch --location=vsplit --cwd=current

map cmd+j next_window
map cmd+k previous_window

# WezTerm の TogglePaneZoomState。kitty に zoom は無く、stack レイアウトが
# アクティブなウィンドウだけを映すことで同じ結果になる。
map cmd+shift+z toggle_layout stack

# kitty の既定は close_tab で危ない。ペインだけを閉じる (editprompt の道連れ付き)。
map cmd+w kitten close_pane.py

# editprompt (Claude Code への入力ペイン) のトグル。
map cmd+e kitten editprompt.py

# 相方のペインで動いているプロセスツリーを右に開く。
map cmd+i kitten pstree.py

# ペインのリサイズモード。WezTerm の key_tables.resize_pane 相当。
# モードの中身は末尾の「リサイズモード」節。
map --new-mode resize cmd+r

#: }}}

#: OS ウィンドウ {{{

map cmd+n       new_os_window_with_cwd
map cmd+grave   macos_cycle_through_os_windows
map cmd+shift+f toggle_fullscreen
map cmd+h       hide_macos_app
map cmd+m       minimize_macos_window
map cmd+q       quit

#: }}}

#: コピー・ペースト {{{

map cmd+c            copy_to_clipboard
map cmd+] paste_from_clipboard

# editprompt に居て、かつクリップボードが画像なら Claude Code へ受け渡す。
# それ以外は普通のペースト。
map cmd+v kitten paste.py

# WezTerm では直前の出力を scrollback から ❯❯❯ を頼りに切り出していた。kitty は
# シェル統合が OSC 133 でコマンドの境界を持っているので、素のアクションで済む。
map cmd+y copy_last_command_output

# WezTerm の CharSelect。
map cmd+shift+c input_unicode_character

#: }}}

#: 検索・スクロール {{{

map cmd+f       search_scrollback
map cmd+shift+j scroll_to_prompt 1
map cmd+shift+k scroll_to_prompt -1

# WezTerm の Search { Regex = "[a-f0-9]{6,}" } 相当。コミットハッシュ拾い。
map cmd+shift+h kitten hints --type hash --program @

#: }}}

#: scrollback を Neovim で読む {{{

# WezTerm 時代の snatch (⌘[) の置き換えとして試用中。kitty-scrollback.nvim が
# nvim をオーバーレイで開く。alias の実体は本体の nvim 設定が入れたプラグイン。
#
# NVIM_APPNAME で最小構成 (~/.config/nvim-dev/scrollback) に振る。本体設定でも
# 動くが、scrollback は開いてすぐ読んで閉じるものなので LSP や補完の autocmd を
# 通したくない (起動 50〜70ms → 21〜26ms)。配色と jab (migemo) だけ載せてある。
action_alias kitty_scrollback_nvim kitten '/Users/jinnouchi.yasushi/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py' --env NVIM_APPNAME=nvim-dev/scrollback

# scrollback 全体。snatch と同じ ⌘[ に割り当てる。
map cmd+[ kitty_scrollback_nvim
# 直前のコマンドの出力だけ。⌘Y (クリップボードへ) の「中身を見る」版。
map cmd+ctrl+[ kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# クリックしたコマンドの出力を開く。
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

#: }}}

#: hints (WezTerm の QuickSelect) {{{

# quick_select_patterns (const.lua の url / tag / path / file) をまとめたもの。
# 選んだ文字列はクリップボードへ入る (--program @)。
#
# 正規表現は必ずクォートで囲む。map の引数はシェル流に分割されるので、URL の
# パターンに含まれる `"` が引用符の開始とみなされ「No closing quotation」になる。
#
# path のパターンだけ WezTerm 版から変えてある。元は `~?(?:[-.\w]+/)+...` で、
# `~` の次が `/` だと `[-.\w]+` が 1 文字も取れずに先頭が脱落し、
# `~/git/foo/bar.txt` が `git/foo/bar.txt` になっていた (`~?` が死んでいた)。
# `/?` を足して `~/...` と `/usr/local/bin` の両方を頭から拾えるようにした。
map cmd+u kitten hints --type regex --program @ --regex '(?:https?://[^()<>"\s{|}^⟨⟩`│⏎]+|[A-Z0-9]+(?:[-_][A-Z0-9]+)+|v?\d+\.\d+(?:\.\d+)?(?:-[-\w+]+)?|~?/?(?:[-.\w]+/)+(?:[-.\w]/?)*|[-\w]+(?:\.[-\w]+)+)'

# WezTerm の open_with。URL を選んで既定のアプリで開く。
map cmd+shift+u open_url_with_hints

#: }}}

#: その他 {{{

map cmd+p       command_palette
# WezTerm の ShowDebugOverlay 相当。kitty を対話的に操作できるシェル。
map cmd+l       kitty_shell overlay
map cmd+shift+r load_config_file

#: }}}

#: キー送出 {{{

# kitty は cmd+enter を既定で new_window に割り当てていた。clear_all_shortcuts で
# 消えてはいるが、editprompt の確定に確実に要るので明示的に流す。
# キーボードプロトコルの符号化で CSI 13;9u になり、nvim では <D-CR>。
map cmd+enter send_key cmd+enter

# ctrl+enter (CSI 13;5u) / shift+enter (CSI 13;2u) / Fn+Enter (CSI 57414u) は
# kitty が素で送るので、WezTerm のような SendString の細工は要らない。

#: }}}

#: リサイズモード (WezTerm の key_tables.resize_pane) {{{

# 入り口は上の `map --new-mode resize cmd+r`。one_shot = false 相当で、
# 明示的に抜けるまで効き続ける。
map --mode resize h       resize_window narrower
map --mode resize shift+h resize_window narrower 10
map --mode resize j       resize_window taller
map --mode resize shift+j resize_window taller 10
map --mode resize k       resize_window shorter
map --mode resize shift+k resize_window shorter 5
map --mode resize l       resize_window wider
map --mode resize shift+l resize_window wider 5
map --mode resize escape  pop_keyboard_mode
map --mode resize ctrl+c  pop_keyboard_mode
map --mode resize q       pop_keyboard_mode
map --mode resize cmd+r   pop_keyboard_mode

#: }}}
