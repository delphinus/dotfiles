# pip の設定。~/.config/pip/pip.conf へ symlink される。
#
# 環境変数 (PIP_*) ではなくここに書くのは、シェルを問わず効かせるため。fish・
# zsh・bash のどれから起動しても、エディタなどシェルを経ない起動でも pip は
# このファイルを読む。

[global]
# 公開から 7 日たっていないリリースを候補から外す。乗っ取られたアカウントから
# 出た悪意のある版は数日で取り下げられることが多いので、その間を避ける。
# P7D のような期間での指定は pip 26.1 から。急ぎで新しい版が要るときは
# コマンドラインで --uploaded-prior-to を指定し直す。
uploaded-prior-to = P7D
