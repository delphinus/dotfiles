# mise のグローバル設定 (旧 asdf)。~/.config/mise/ ごと symlink される。
#
# [tools] は asdf 時代の ~/.tool-versions から移したもの。~/.tool-versions は
# mise も読むが、mise はこれを「グローバル設定」ではなく「cwd から親へ辿って
# 見つかる設定」として扱うため、$HOME の外 (/tmp 等) に cd すると一切読まれない
# (確認済み)。asdf の ~/.tool-versions はどこでも読まれていたので、真のグローバル
# 設定であるこのファイルに置いて挙動を揃える。
#
# 版を変えるときは `mise use -g <tool>@<version>` でよい。このファイルが直接
# 書き換わるので、dotfiles の差分として見えるようになっている。
#
# node / go は自宅の Mac で Homebrew 版 (node 26.7.0 / go 1.26.6) を使っていた
# ものを mise の shim が隠してしまうため、そちらに合わせて上げた。ここはあくまで
# グローバルの初期値で、プロジェクトは .tool-versions / .nvmrc 側が勝つ。
#
# lua だけは最新 (5.5.1) にせず 5.1.5 のまま。Neovim (LuaJIT) が 5.1 互換で、
# プラグインの busted テストもそれに揃えているため。

[tools]
node = "26.7.0"
ruby = "3.4.7"
go = "1.26.6"
lua = "5.1.5"
python = "3.14.1"
perl = "5.42.0"

[settings]
# asdf の `legacy_version_file = yes` (~/.asdfrc) 相当。
#
# mise は .nvmrc / .node-version / .ruby-version のような言語ごとの版ファイルを
# 何もしないと「全部無視する」(asdf と逆で opt-in)。仕事のリポジトリには
# .tool-versions を置かずこちらだけ持っているものがあるので、扱うツールを
# 明示して有効化する。
#
# perl / lua にこの種の版ファイルの慣習は無いが、列挙しておいても害は無いので
# [tools] と揃えておく。
idiomatic_version_file_enable_tools = ["node", "ruby", "python", "go", "perl", "lua"]

[settings.go]
# `go install` の出力先を $GOPATH/bin (= ~/.go/bin) に戻す。
#
# mise は何もしないと GOBIN を「今使っている go のインストールディレクトリ」
# (~/.local/share/mise/installs/go/<version>/bin) に向ける。そこへ入れると
# `mise use -g go@<新版>` したとたん入れたバイナリが消える。asdf 時代に
# ~/.asdf/installs/golang/<version>/bin へグローバルインストールしたものが
# asdf を捨てるときに全部道連れになったのと同じ罠なので、塞いでおく。
#
# ~/.go/bin は config.fish の $paths に入っているので PATH は変わらない。
set_gobin = false
