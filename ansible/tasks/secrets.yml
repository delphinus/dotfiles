- name: ensure ~/.config/gitleaks exists
  file:
    path: ~/.config/gitleaks
    state: directory
    mode: "0755"
- name: make ~/.config/gitleaks/dotfiles.toml
  template:
    src: gitleaks_dotfiles.toml.j2
    dest: ~/.config/gitleaks/dotfiles.toml
    mode: "0644"
- name: remove legacy ~/.git_prohibited_words
  file:
    path: ~/.git_prohibited_words
    state: absent
- name: make .git/hooks/pre-commit
  template: >-
    src=git_hooks_pre-commit.j2 dest=~/git/dotfiles/.git/hooks/pre-commit
- file: path=~/git/dotfiles/.git/hooks/pre-commit mode=0755
# pre-commit は staged の差分しか見ないので、メッセージにだけ出る語は素通りする。
# commit-msg で同じ禁止語リストを当てて塞ぐ。
- name: make .git/hooks/commit-msg
  template: >-
    src=git_hooks_commit-msg.j2 dest=~/git/dotfiles/.git/hooks/commit-msg
- file: path=~/git/dotfiles/.git/hooks/commit-msg mode=0755
- name: ensure ~/.ssh exists
  file:
    path: ~/.ssh
    state: directory
    mode: "0700"
# ssh_config の IdentityFile が指す公開鍵。秘密鍵は 1Password の SSH agent
# (.config/1Password/ssh/agent.toml) が持つので手元には要らないが、.pub が無いと
# ssh は identity を絞れず agent の鍵を順に試す。すると EMU 用の Host
# (github-emu) でも先に出た個人鍵で認証が通ってしまい、EMU org のリポジトリが
# 「Repository not found」になる。2026-09-07 に踏んだ。
#
# アイテム名と置き場は agent.toml および bin/secrets-lib.sh の
# SECRETS_ACCOUNT / SECRETS_VAULT と同じ。1Password から毎回引き直すので、
# 鍵をローテートしても追従する。
- name: read ssh public keys from 1Password
  command: >-
    op read --account my.1password.com
    "op://Private/{{ item }}/public key"
  loop:
    - id_ed25519
    - id_ed25519_emu
  register: ssh_public_keys
  changed_when: false
  check_mode: false
- name: make .ssh/*.pub
  copy:
    content: "{{ item.stdout }} {{ item.item }}\n"
    dest: "~/.ssh/{{ item.item }}.pub"
    mode: "0644"
  loop: "{{ ssh_public_keys.results }}"
  loop_control:
    label: "~/.ssh/{{ item.item }}.pub"
- name: make .ssh/config
  template: >-
    src=ssh_config.j2 dest=~/.ssh/config mode=0600
- name: make .gitconfig_local
  template: >-
    src=gitconfig_local.j2 dest=~/.gitconfig_local
# 端末のどこでも効かせたい環境変数。fish と POSIX で同じ secret_env を吐く。
# 以前の 1Password Environments (~/.env → ~/.envrc → direnv) を畳んだ置き換え。
# 詳細は env_fish.j2 の冒頭コメント参照。
- name: make conf.d/00-env.fish
  template: >-
    src=env_fish.j2 dest=~/.config/fish/conf.d/00-env.fish mode=0600
- name: make ~/.config/env.sh
  template: >-
    src=env_sh.j2 dest=~/.config/env.sh mode=0600
- name: make aws-vault.fish
  template: >-
    src=aws-vault.fish.j2 dest=~/.config/fish/conf.d/aws-vault.fish
# - name: make general .my.cnf
#   template: >-
#     src=my_cnf.j2 dest=~/.my.cnf
- name: make memo directory
  file: path=~/.config/memo state=directory
- name: make config for memo
  template: >-
    src=config_memo_toml.j2 dest=~/.config/memo/config.toml
- name: make git config files for each host
  copy:
    content: "{{ item.content }}"
    dest: "{{ item.filename }}"
  loop: "{{ secret_git_configs }}"
  loop_control:
    label: "{{ item.filename }}"
  no_log: true
- name: make cloudflared access tcp LaunchAgent
  template:
    src: cloudflared_access_tcp.plist.j2
    dest: ~/Library/LaunchAgents/com.cloudflare.cloudflared.access.tcp.plist
- name: make .pause
  template: src=pause.j2 dest=~/.config/.pause
- name: make tm.fish
  template: src=tm.fish.j2 dest=~/.config/fish/functions/tm.fish
- name: ensure dirs for managed config files
  file:
    path: "{{ item.dest | dirname | expanduser }}"
    state: directory
    mode: "0700"
  loop: "{{ secret_config_files | default([]) }}"
  loop_control:
    label: "{{ item.dest | dirname }}"
- name: write managed config files
  copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest | expanduser }}"
    mode: "{{ item.mode | default('0600') }}"
  loop: "{{ secret_config_files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  no_log: true
