      - gibo
      - git
      - go
      - grc
      - htop
      - hub
      - jq
      - macvim
      - moreutils
      - mycli
      - neovim
      - peco
      - prettyping
      - pstree
      - sanemat/font/ricty
      - shellcheck
      - terminal-notifier
      - the_platinum_searcher
      - tig
      - tmux
      - tree
      - universal-ctags
      - watch
      - z
