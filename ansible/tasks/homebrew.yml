---
- homebrew:
    state: latest
    name:
      - ansible
      - ccze
      - cmigemo
      - coreutils
      - delphinus/ghg/ghg
      - diff-so-fancy
      # docker は入れない。Docker Desktop が同じ CLI と補完を持っており、
