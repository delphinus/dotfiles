---
- name: prepare config dir
  file: path=~/.config/vifm/colors state=directory

- name: prepare ptpython config dir
  file: path=~/.ptpython state=directory

- name: prepare direnv config dir
  file: path=~/.config/direnv state=directory

- name: prepare bat config dir
  file: path=~/.config/bat state=directory

- name: prepare docker config dir
  file: path=~/.docker state=directory

- name: prepare bpytop config dir
  file: path=~/.config/bpytop state=directory

- name: prepare hammerspoon config dir
  file: path=~/.hammerspoon state=directory

- name: prepare ghostty config dir
  file: path=~/.config/ghostty state=directory

- name: prepare ccstatusline config dir
  file: path=~/.config/ccstatusline state=directory

- name: prepare goneovim config dir
  file: path=~/.config/goneovim state=directory

- name: prepare 1Password directory
  file: >-
    path=~/.config/1Password
    state=directory

- name: prepare karabiner directory
  file: >-
    path='~/.config/karabiner/assets/complex_modifications'
    state=directory
  when: ansible_facts["system"] == 'Darwin'

- name: prepare hishtory config dir
  file: path=~/.hishtory state=directory

- name: make hishtory config symlinks
  file: >-
    src={{ '/'.join([dotfiles_dir, item]) }}
    dest=~/{{ item }}
    state=link
    force=yes
  with_items:
    - .hishtory/config.bash
    - .hishtory/config.fish
    - .hishtory/config.zsh

# bash / zsh は対話シェルとして使っていないのに、rc ファイルが「存在する」だけで
# インストーラの追記先にされる。LM Studio の lms bootstrap は
# .profile / .bashrc / .bash_profile / .zshrc / config.fish / .cshrc / .tcshrc を
# 順に見て、存在してかつ ~/.lmstudio/bin の絶対パスを含まないものへ PATH 行を
# 追記する (存在しないファイルは黙って飛ばす)。symlink 先が repo なので、これが
# 毎回 dotfiles の差分として現れていた。配るのをやめれば追記先が消える。
#
# .asdfrc はツール管理を asdf から mise へ移したときに不要になった。設定は
# ~/.config/mise/config.toml に移してある (legacy_version_file = yes は
# settings.idiomatic_version_file_enable_tools が相当)。asdf 本体と ~/.asdf は
# しばらく残すが、この rc を配り続けると mise と二重に効いているように見えて
# 紛らわしいので消す。
- name: remove dotfiles symlinks no longer distributed
  file: path=~/{{ item }} state=absent
  with_items:
    - .asdfrc
    - .bashrc
    - .zshrc

- name: make dotfiles symlink
  file: >-
    src={{ '/'.join([dotfiles_dir, item]) }}
    dest=~/{{ item }}
    state=link
    force=yes
  with_items:
    - .zprofile
    - .config/1Password/ssh
    - .config/alacritty
    - .config/bat/config
    - .config/bpytop/bpytop.conf
    - .config/ccstatusline/settings.json
    - .config/efm-langserver
    - .config/ghostty/config
    - .config/fish
    - .config/gocode
    - .config/goneovim/settings.toml
    - .config/ipython
    - .config/karabiner/assets/complex_modifications
    - .config/kitty
    - .config/mise
    - .config/nvim
    - .config/nvim-dev
    - .config/peco
    - .config/powerline
    - .config/ranger
    - .config/vifm/colors/nord.vifm
    - .config/vifm/vifmrc
    - .config/yamllint
    - .editrc
    - .fdignore
    - .gitconfig
    - .gitignore-global
    - .golangci.yml
    - .grcat
    - .hammerspoon/init.lua
    - .inputrc
    - .iterm2
    - .iterm2_shell_integration.zsh
    - .jsbeautifyrc
    - .jshintrc
    - .nbrc
    - .proverc
    - .ptconfig.toml
    - .ptpython/config.py
    - .tern-project
    - .tmux
    - .tmux.conf
    - .vimrc_first.vim

- file: >-
    dest=~/.local/share/nvim/{{ item }}
    state=directory
    mode=0700
  with_items:
    - backup
    - swap
    - undo

- name: symlink dircolors
  file: >-
    src={{ dotfiles_dir }}/submodules/nord-dircolors/src/dir_colors
    dest=~/.dir_colors
    state=link
    force=yes

- git: >-
    repo=https://{{ item }}
    dest=~/git/{{ item }}
  with_items:
    - github.com/takaaki-kasai/git-foresta

- file: path=~/.ghg/bin state=directory
- file: >-
    src=~/git/github.com/takaaki-kasai/git-foresta/git-foresta
    dest=~/.ghg/bin/git-foresta
    state=link
    force=yes

