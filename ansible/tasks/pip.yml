---
- dnf:
    name: gcc, python36-devel, rpm-build
  become: true
  when: ansible_facts['system'] == 'Linux' and ansible_facts['distribution'] == 'CentOS'
- pip:
    name:
      - iterm2
      - neovim-remote
      - git+https://github.com/Vimjas/vint
    executable: pip3
    extra_args: --user
    state: latest

